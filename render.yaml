# Render Blueprint: PostgreSQL, the Express API, and the React static site.
# The web app can also be hosted on Vercel instead (see vercel.json); the API
# only needs APP_URL and CORS_ORIGINS to point at whichever CDN serves it.
#
# Deploy: https://render.com/deploy?repo=https://github.com/danieljosephm-11/provision-store
#
# After the first deploy, copy the static site URL (for example
# https://provision-store-web.onrender.com) into APP_URL and CORS_ORIGINS on
# the API service. The static site already points VITE_API_URL at the API.

databases:
  - name: provision-store-db
    databaseName: provision_store
    user: provision_store
    plan: free
    region: singapore

services:
  - type: web
    name: provision-store-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @ps/api
    startCommand: npm run db:deploy -w @ps/api && npm run db:seed:if-empty -w @ps/api && node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: provision-store-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: BCRYPT_ROUNDS
        value: 12
      # Different registrable domains (vercel.app vs onrender.com), so the
      # refresh cookie must be SameSite=None; Secure.
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: none
      # Add APP_URL and CORS_ORIGINS in the Render dashboard after the first
      # Vercel deploy. They are intentionally omitted here so the blueprint
      # never ships a placeholder origin that could be trusted by accident.
      - key: UPLOAD_DIR
        value: uploads
      - key: MAX_UPLOAD_MB
        value: 5
      - key: ENABLE_CRON
        value: true
      - key: SEED_ADMIN_NAME
        value: Store Owner
      - key: SEED_ADMIN_EMAIL
        value: admin@provisionstore.local
      # Prompted at blueprint creation; never committed to the repository.
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STORE_NAME
        value: Smart Provision Store
      - key: SEED_STORE_STATE_CODE
        value: "33"

  # The React app is a static site on Render's CDN. Vercel can host the same
  # build instead (vercel.json); the API does not care which CDN serves it.
  - type: web
    name: provision-store-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build -w @ps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://provision-store-api.onrender.com/api/v1
